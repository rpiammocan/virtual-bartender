server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Built-in recipe photos are packaged with the frontend under /media.
    # User/imported/local recipe images still live in the backend media folder.
    # Serve a packaged file first; if it does not exist, fall back to FastAPI.
    location /media/ {
        try_files $uri @backend_media;
    }

    location @backend_media {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
