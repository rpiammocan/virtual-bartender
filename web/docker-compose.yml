name: virtual-bartender-web

services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/bartender.db
      BACKUPS_PATH: /backups
      MEDIA_PATH: /data/images
    volumes:
      - bartender_web_data:/data
      - bartender_web_backups:/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - bartender_web

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bartender_web

volumes:
  bartender_web_data:
  bartender_web_backups:

networks:
  bartender_web:
    driver: bridge
