name: Patch seeder to retire stale built-ins

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/patch_seed_retire_stale_builtins.py"
      - ".github/workflows/patch-seed-retire-stale-builtins.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch seeder
        run: python3 scripts/patch_seed_retire_stale_builtins.py
      - name: Validate Python syntax
        run: python3 -m py_compile backend/app/seed.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/seed.py
          if ! git diff --cached --quiet; then
            git commit -m "Retire stale built-in recipes during seeding"
            git push
          fi
