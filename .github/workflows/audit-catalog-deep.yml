name: Deep recipe catalog QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/app/**"
      - "scripts/audit_catalog_deep.py"
      - ".github/workflows/audit-catalog-deep.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run deep catalog audit
        run: python3 scripts/audit_catalog_deep.py

      - name: Commit deep QA report
        if: always()
        run: |
          if [ -f docs/catalog-deep-qa.json ] && [ -f docs/catalog-deep-qa.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/catalog-deep-qa.json docs/catalog-deep-qa.md
            if ! git diff --cached --quiet; then
              git commit -m "Update deep catalog QA report"
              git push
            fi
          fi
