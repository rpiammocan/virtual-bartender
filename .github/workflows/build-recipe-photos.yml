name: Build recipe photos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_recipe_photos.py'
      - '.github/workflows/build-recipe-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Build 800px WebP recipe photos
        run: python scripts/build_recipe_photos.py
      - name: Commit optimized photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/media/*.webp
          if git diff --cached --quiet; then
            echo "Recipe photos are already current."
          else
            git commit -m "Add optimized proof recipe photos"
            git push
          fi
