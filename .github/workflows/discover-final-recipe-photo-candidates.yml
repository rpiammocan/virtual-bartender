name: Discover final recipe photo candidates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-recipe-photo-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies needed by planner
        run: python -m pip install -r backend/requirements.txt
      - name: Plan all recipes still missing images
        run: python scripts/plan_recipe_photo_batch.py --size 999 --output docs/recipe-photo-final-batch.json
      - name: Discover Wikimedia Commons candidates for all remaining recipes
        run: python scripts/discover_recipe_photo_candidates.py --batch docs/recipe-photo-final-batch.json --output docs/recipe-photo-final-candidates.json
      - name: Commit final batch and candidate manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recipe-photo-final-batch.json docs/recipe-photo-final-candidates.json
          if git diff --cached --quiet; then
            echo "Final recipe photo candidate manifest is already current."
          else
            git commit -m "Add final remaining recipe photo candidates"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
