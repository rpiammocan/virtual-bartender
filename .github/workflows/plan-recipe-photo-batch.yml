name: Plan recipe photo batch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/plan_recipe_photo_batch.py'
      - '.github/workflows/plan-recipe-photo-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recipe-photo-planner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Build 100-recipe image batch manifest
        run: python scripts/plan_recipe_photo_batch.py --size 100 --output docs/recipe-photo-batch-1.json
      - name: Commit batch manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recipe-photo-batch-1.json
          if git diff --cached --quiet; then
            echo "Batch manifest is already current."
            exit 0
          fi
          git commit -m "Plan first 100-recipe photo batch"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
