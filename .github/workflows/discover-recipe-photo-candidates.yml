name: Discover recipe photo candidates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recipe-photo-candidate-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover Wikimedia Commons candidates
        run: python scripts/discover_recipe_photo_candidates.py
      - name: Commit candidate manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recipe-photo-candidates-batch-1.json
          if git diff --cached --quiet; then
            echo "Candidate manifest is already current."
          else
            git commit -m "Add Batch 1 recipe photo candidates"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
