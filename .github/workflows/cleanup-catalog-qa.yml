name: Apply catalog QA cleanup

on:
  push:
    branches:
      - main
    paths:
      - "scripts/cleanup_catalog_qa.py"
      - ".github/workflows/cleanup-catalog-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply cleanup
        run: python3 scripts/cleanup_catalog_qa.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/seed.py backend/app/catalog_v5.py
          if ! git diff --cached --quiet; then
            git commit -m "Apply first catalog and image QA cleanup"
            git push
          fi
